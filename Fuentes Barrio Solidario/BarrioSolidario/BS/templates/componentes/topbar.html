<style>
  /* Mantiene el menú de cuenta por encima de la barra de navegación fija. */
  .topbar { position: relative; z-index: 1031; }
  .topbar .topbar-inner { min-height: 46px; }
  .topbar .account-trigger { display: inline-flex; align-items: center; gap: .5rem; min-height: 38px; padding: 2px 6px; border: 0; border-radius: .5rem; background: transparent; color: inherit; }
  .topbar .account-avatar { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #17365d; font-size: 1.15rem; }
  .topbar .account-name { display: inline-block; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .account-menu { min-width: 245px; max-width: min(92vw, 320px); background: #fff; color: #233a66; border: 1px solid #dbe2ec; }
  .topbar .account-menu .dropdown-item { color: #233a66; text-decoration: none; white-space: normal; }
  .topbar .account-menu .dropdown-item:hover,
  .topbar .account-menu .dropdown-item:focus { color: #c91944; background: #f4f6fa; text-decoration: none; }
  .topbar .account-menu .dropdown-header { color: #64748b; }
  .topbar .account-menu .dropdown-item:active { color: #fff; background: #233a66; }
  .topbar .account-menu .account-email { overflow-wrap: anywhere; }
</style>
<div class="topbar py-2">
  <div class="container topbar-inner d-flex flex-column flex-md-row gap-2 justify-content-between align-items-md-center">
    <div class="d-flex flex-wrap gap-3 align-items-center">
      <a href="mailto:contacto@barriosolidario.org"><i class="bi bi-envelope-fill me-1" aria-hidden="true"></i> contacto@barriosolidario.org</a>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a href="{% url 'inicio' %}#contacto" class="top-icon" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Contacto" aria-label="Ir a contacto"><i class="bi bi-person-lines-fill" aria-hidden="true"></i></a>
      <a href="{% url 'inicio' %}#metricas" class="top-icon" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Ver métricas" aria-label="Ver métricas"><i class="bi bi-bar-chart-fill" aria-hidden="true"></i></a>
      {% if user.is_authenticated %}
      <div class="dropdown">
        <button type="button" class="account-trigger dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Opciones de cuenta de {{ user.get_full_name|default:user.username }}">
          <span class="account-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
          <span class="account-name">{{ user.get_full_name|default:user.username }}</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end account-menu shadow">
          <div class="px-3 py-2">
            <strong class="d-block">{{ user.get_full_name|default:user.username }}</strong>
            <small class="d-block account-email text-muted">{{ user.email }}</small>
            <small class="d-block text-muted">Último acceso: {{ user.last_login|date:"d/m/Y H:i"|default:"Primer acceso" }}</small>
          </div>
          <hr class="dropdown-divider">
          <h6 class="dropdown-header">Personalización</h6>
          <a class="dropdown-item" href="{% url 'perfil_cuenta' %}"><i class="bi bi-person-gear me-2" aria-hidden="true"></i>Mi perfil</a>
          <a class="dropdown-item" href="{% url 'cambiar_clave_cuenta' %}"><i class="bi bi-key me-2" aria-hidden="true"></i>Cambiar contraseña</a>
          <h6 class="dropdown-header">Trabajo</h6>
          <a class="dropdown-item" href="{% url 'panel_cuenta' %}"><i class="bi bi-grid-1x2 me-2" aria-hidden="true"></i>Mi panel</a>
          <hr class="dropdown-divider">
          <form method="post" action="{% url 'cerrar_sesion_cuenta' %}">
            {% csrf_token %}
            <button class="dropdown-item" type="submit"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Cerrar sesión</button>
          </form>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</div>
